name: shoplite
description: "A product browser with Supabase auth and favourites."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Declarative navigation with redirect guards
  go_router: ^14.8.1

  # Supabase Flutter SDK for auth and database
  supabase_flutter: ^2.9.0

  # HTTP client for the product API
  http: ^1.4.0

  # Google Fonts for typography
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
